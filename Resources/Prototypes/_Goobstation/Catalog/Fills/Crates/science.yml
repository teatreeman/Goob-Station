- type: entity
  id: CrateScienceModsuitCoresFilled
  parent: CrateScienceSecure
  name: MOD cores crate
  description: Contains three MOD cores inside.
  components:
  - type: StorageFill
    contents:
    - id: ModsuitCoreStandard
      amount: 3

- type: entity
  id: CrateScienceResearchServerFilled
  parent: CrateScienceSecure
  name: R&D server crate
  description: Contains a flatpack of a R&D server and a few R&D computers. Requires Science access to open.
  components:
  - type: StorageFill
    contents:
    - id: ResearchAndDevelopmentServerMachineFlatpack
      amount: 1
    - id: ResearchComputerFlatpack
      amount: 3

- type: entity
  parent: CrateScienceSecure
  id: CrateScienceTransferValves
  name: tank transfer valves crate
  description: Two tank transfer valves. Requires Research Director access to open.
  components:
  - type: AccessReader
    access: [["ResearchDirector"]]
  - type: StorageFill
    contents:
    - id: TransferValve
      amount: 2
